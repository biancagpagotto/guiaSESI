<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiaSESI - Alunos</title>

    <link rel="stylesheet" href="alunos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>
        </div>

        <div class="usuario">
            <div class="texto-usuario">
                <h3>Usuário</h3>
                <p>Professor</p>
            </div>

            <img src="perfil.png" alt="Perfil">
        </div>

    </header>

    <main>

        <h2>Alunos</h2>

        <div class="container">

            <div class="titulo-lista">
                <h3>Lista de alunos</h3>
                <p>Consulte os alunos e suas respectivas turmas.</p>
            </div>

            <div class="aluno">
                <div class="icone-aluno">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="dados-aluno">
                    <h3>João Silva</h3>
                    <p>6º ano - Turma A</p>
                </div>

                <a href="#" class="botao">Visualizar</a>
            </div>

            <div class="aluno">
                <div class="icone-aluno">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="dados-aluno">
                    <h3>Maria Oliveira</h3>
                    <p>7º ano - Turma B</p>
                </div>

                <a href="#" class="botao">Visualizar</a>
            </div>

            <div class="aluno">
                <div class="icone-aluno">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="dados-aluno">
                    <h3>Pedro Santos</h3>
                    <p>8º ano - Turma A</p>
                </div>

                <a href="#" class="botao">Visualizar</a>
            </div>

            <div class="aluno">
                <div class="icone-aluno">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="dados-aluno">
                    <h3>Ana Costa</h3>
                    <p>9º ano - Turma B</p>
                </div>

                <a href="#" class="botao">Visualizar</a>
            </div>

        </div>

    </main>

</body>
</html>
