<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaSESI - Arquivos de Provas</title>

    <link rel="stylesheet" href="arquivos_de_provas.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>

        </div>

        <div class="usuario">

            <div class="texto-usuario">
                <h3>Aluno(a)</h3>
                <p>Série - Turma</p>
            </div>

            <img src="perfil.png" alt="Perfil">

        </div>

    </header>

    <main>

        <h2>Arquivos de Provas</h2>

        <div class="container">

            <section class="filtros">

                <h3>Filtros</h3>

                <label>Ano</label>

                <select>
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                </select>

                <label>Série</label>

                <select>
                    <option>6º Ano</option>
                    <option>7º Ano</option>
                    <option>8º Ano</option>
                    <option>9º Ano</option>
                    <option>1º EM</option>
                </select>

                <label>Disciplina</label>

                <select>
                    <option>Matemática</option>
                    <option>Português</option>
                    <option>História</option>
                    <option>Geografia</option>
                    <option>Ciências</option>
                </select>

            </section>

            <section class="provas">

                <div class="prova">

                    <div>
                        <h3>Matemática</h3>
                        <p>6º Ano • 2026 • 1ª Etapa</p>
                    </div>

                    <a href="#">Abrir</a>

                </div>

                <div class="prova">

                    <div>
                        <h3>Português</h3>
                        <p>6º Ano • 2026 • 1ª Etapa</p>
                    </div>

                    <a href="#">Abrir</a>

                </div>

                <div class="prova">

                    <div>
                        <h3>Ciências</h3>
                        <p>6º Ano • 2026 • 2ª Etapa</p>
                    </div>

                    <a href="#">Abrir</a>

                </div>

                <div class="prova">

                    <div>
                        <h3>História</h3>
                        <p>6º Ano • 2025 • 3ª Etapa</p>
                    </div>

                    <a href="#">Abrir</a>

                </div>

                <div class="prova">

                    <div>
                        <h3>Geografia</h3>
                        <p>6º Ano • 2025 • 2ª Etapa</p>
                    </div>

                    <a href="#">Abrir</a>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
