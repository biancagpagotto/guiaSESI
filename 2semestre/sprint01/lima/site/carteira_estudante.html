<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaSESI - Carteira de Estudante</title>

    <link rel="stylesheet" href="carteira_estudante.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>

        </div>

        <div class="usuario">

            <div class="texto-usuario">
                <h3>Aluno(a)</h3>
                <p>Série - Turma</p>
            </div>

            <img src="perfil.png" alt="Perfil">

        </div>

    </header>

    <main>

        <h2>Área Pessoal</h2>

        <h3 class="titulo">Carteira de estudante</h3>

        <section class="carteiras">

            <div class="card">

                <img src="carteira_frente.jpeg" alt="Carteira Frente">

                <p>Frente</p>

            </div>

            <div class="card">

                <img src="carteira_verso.jpeg" alt="Carteira Verso">

                <p>Verso</p>

            </div>

        </section>

    </main>

</body>

</html>
