<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaSESI - Histórico Escolar</title>

    <link rel="stylesheet" href="historico_escolar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>
        </div>

        <div class="usuario">
            <div class="texto-usuario">
                <h3>Aluno(a)</h3>
                <p>Série - Turma</p>
            </div>

            <img src="perfil.png" alt="Perfil">
        </div>

    </header>

    <main>

        <h2>Histórico Escolar</h2>

        <section class="historico">

            <div class="dados">

                <div>
                    <h4>Aluno</h4>
                    <p>Nome do Aluno</p>
                </div>

                <div>
                    <h4>RA</h4>
                    <p>123456789</p>
                </div>

                <div>
                    <h4>Escola</h4>
                    <p>SESI</p>
                </div>

            </div>

            <table>

                <thead>

                    <tr>
                        <th>Ano</th>
                        <th>Série</th>
                        <th>Resultado</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>2023</td>
                        <td>6º Ano</td>
                        <td class="aprovado">Aprovado</td>
                    </tr>

                    <tr>
                        <td>2024</td>
                        <td>7º Ano</td>
                        <td class="aprovado">Aprovado</td>
                    </tr>

                    <tr>
                        <td>2025</td>
                        <td>8º Ano</td>
                        <td class="aprovado">Aprovado</td>
                    </tr>

                    <tr>
                        <td>2026</td>
                        <td>9º Ano</td>
                        <td class="cursando">Cursando</td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</body>

</html>
