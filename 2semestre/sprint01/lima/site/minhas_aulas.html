<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiaSESI - Minhas Aulas</title>

    <link rel="stylesheet" href="minhas_aulas.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>
        </div>

        <div class="usuario">
            <div class="texto-usuario">
                <h3>Professor(a)</h3>
                <p>Minhas Aulas</p>
            </div>

            <img src="perfil.png" alt="Perfil">
        </div>

    </header>

    <main>

          <h2>Minhas Aulas</h2>

        <section class="aulas">

            <div class="aula">
                <i class="fa-solid fa-calculator"></i>
                <h3>Matemática</h3>
                <p>Turma: 8º Ano</p>
                <p>Horário: 7h às 8h</p>
            </div>

            <div class="aula">
                <i class="fa-solid fa-book"></i>
                <h3>Português</h3>
                <p>Turma: 9º Ano</p>
                <p>Horário: 8h às 9h</p>
            </div>

            <div class="aula">
                <i class="fa-solid fa-flask"></i>
                <h3>Ciências</h3>
                <p>Turma: 7º Ano</p>
                <p>Horário: 9h às 10h</p>
            </div>

            <div class="aula">
                <i class="fa-solid fa-globe"></i>
                <h3>Geografia</h3>
                <p>Turma: 6º Ano</p>
                <p>Horário: 10h às 11h</p>
            </div>

        </section>

    </main>

</body>

</html>
