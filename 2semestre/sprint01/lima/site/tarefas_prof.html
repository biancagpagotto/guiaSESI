<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GuiaSESI - Tarefas</title>

<link rel="stylesheet" href="tarefas_prof.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<div class="logo-icon">
<i class="fa-solid fa-compass"></i>
</div>

<h1>
<span class="guia">Guia</span><span class="sesi">SESI</span>
</h1>

</div>

<div class="usuario">

<div class="texto-usuario">
<h3>Usuário</h3>
<p>Professor</p>
</div>

<img src="perfil.png" alt="Perfil">

</div>

</header>

<main>

<h2>Tarefas</h2>

<div class="container">

<section class="cadastro">

<h3>Nova tarefa</h3>

<input type="text" placeholder="Título">

<select>
<option>Selecione a disciplina</option>
<option>Matemática</option>
<option>Português</option>
<option>História</option>
<option>Geografia</option>
<option>Biologia</option>
<option>Química</option>
<option>Física</option>
</select>

<select>
<option>Selecione a turma</option>
<option>6º Ano</option>
<option>7º Ano</option>
<option>8º Ano</option>
<option>9º Ano</option>
<option>1º EM</option>
<option>2º EM</option>
<option>3º EM</option>
</select>

<input type="date">

<textarea placeholder="Descrição da tarefa"></textarea>

<button>
    <i class="fa-solid fa-plus"></i>
    Publicar tarefa
</button>

</section>

<section class="lista">

<h3>Tarefas publicadas</h3>

<div class="card">

<h4>Matemática</h4>

<p>Lista de exercícios página 52.</p>

<span>Entrega: 20/11/2026</span>

</div>

<div class="card">

<h4>Biologia</h4>

<p>Pesquisa sobre citologia.</p>

<span>Entrega: 22/11/2026</span>

</div>

<div class="card">

<h4>História</h4>

<p>Resumo da Revolução Francesa.</p>

<span>Entrega: 25/11/2026</span>

</div>

</section>

</div>

</main>

</body>

</html>
