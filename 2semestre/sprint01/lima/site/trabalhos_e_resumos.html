<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaSESI - Trabalhos e Resumos</title>

    <link rel="stylesheet" href="trabalhos_e_resumos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-compass"></i>
            </div>

            <h1>
                <span class="guia">Guia</span><span class="sesi">SESI</span>
            </h1>

        </div>

        <div class="usuario">

            <div class="texto-usuario">
                <h3>Aluno(a)</h3>
                <p>Série - Turma</p>
            </div>

            <img src="perfil.png" alt="Perfil">

        </div>

    </header>

    <main>

        <h2>Trabalhos e Resumos</h2>

        <div class="container">

            <section class="lado-esquerdo">

                <a href="#" class="btn-upload">
                    <i class="fa-solid fa-plus"></i>
                    Adicionar seu trabalho
                </a>

                <ul class="lista-arquivos">

                    <li>Trabalho de Matemática</li>

                    <li>Resumo de Português</li>

                    <li>Pesquisa de Biologia</li>

                    <li>Mapa de Geografia</li>

                    <li>Projeto de História</li>

                </ul>

            </section>

            <section class="lado-direito">

                <h3>Resumos</h3>

                <div class="cards">

                    <div class="card">
                        <img src="arquivo.png" alt="Matemática">
                        <p>Área</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Geometria">
                        <p>Geometria</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Português">
                        <p>Adjetivos</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Biologia">
                        <p>Células</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Citologia">
                        <p>Citologia</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Geografia">
                        <p>Clima</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="História">
                        <p>Rev. Francesa</p>
                    </div>

                    <div class="card">
                        <img src="arquivo.png" alt="Era Napoleônica">
                        <p>Era Napoleônica</p>
                    </div>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
